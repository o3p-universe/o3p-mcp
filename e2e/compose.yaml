# End-to-end stack: PostgreSQL 17, Odoo 20 with o3p_mcp (and pglast, from the
# addon's scripts/Dockerfile.test), a second PostgreSQL 17 instance as the SQL
# sandbox (set up by the addon's scripts/sandbox-setup.sql), and nginx as the
# reverse proxy in front of Odoo (proxy_mode needs X-Forwarded-* headers).
#
# Every service shares the host network so that Odoo, okf-mcp (a host
# process) and the test client all reach each other under the same loopback
# URLs: the issuer and the MCP URL must be https or http on localhost, and
# Odoo's "Check MCP server" button calls okf-mcp from inside the container.
#
#   proxy  127.0.0.1:${E2E_ODOO_PORT:-18069}   public Odoo URL (the issuer)
#   odoo   127.0.0.1:${E2E_ODOO_INTERNAL_PORT:-18070}
#   db     127.0.0.1:${E2E_DB_PORT:-15432}
#   sandbox 127.0.0.1:${E2E_SANDBOX_PORT:-15433}
name: o3p-e2e

services:
  db:
    image: postgres:17
    network_mode: host
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    command:
      - postgres
      - -c
      - listen_addresses=127.0.0.1
      - -c
      - port=${E2E_DB_PORT:-15432}
      - -c
      - fsync=off
      - -c
      - shared_buffers=64MB
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p ${E2E_DB_PORT:-15432} -U odoo -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The SQL sandbox: its own instance, an empty database and powerless
  # roles, created at first start by the addon's own scripts.
  sandbox:
    image: postgres:17
    network_mode: host
    environment:
      PGPORT: ${E2E_SANDBOX_PORT:-15433}
      POSTGRES_USER: sandbox_admin
      POSTGRES_PASSWORD: sandbox-admin-e2e
      POSTGRES_DB: postgres
      O3P_SQL_PASSWORD: ${O3P_SQL_PASSWORD:-o3p-sql-e2e}
      O3P_SQL_ROLES: "4"
    command: ["postgres", "-c", "listen_addresses=127.0.0.1", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ../scripts/sandbox-init.sh:/docker-entrypoint-initdb.d/o3p-sandbox.sh:ro
      - ../scripts/sandbox-setup.sql:/o3p/sandbox-setup.sql:ro
    security_opt:
      - label:disable
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p ${E2E_SANDBOX_PORT:-15433} -U sandbox_admin -d o3p_sqlbox"]
      interval: 2s
      timeout: 5s
      retries: 30

  odoo:
    build:
      context: ../scripts
      dockerfile: Dockerfile.test
    image: o3p-e2e-odoo:20.0
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    environment:
      HOST: 127.0.0.1
      PORT: ${E2E_DB_PORT:-15432}
      USER: odoo
      PASSWORD: odoo
      PYTHONDONTWRITEBYTECODE: "1"
      O3P_SQL_PASSWORD: ${O3P_SQL_PASSWORD:-o3p-sql-e2e}
    command:
      - odoo
      - --database=o3p_e2e
      - --db-filter=^o3p_e2e$$
      - --no-database-list
      - --proxy-mode
      - --workers=0
      - --max-cron-threads=0
      - --http-interface=127.0.0.1
      - --http-port=${E2E_ODOO_INTERNAL_PORT:-18070}
      - --log-level=warn
      - --log-handler=werkzeug:WARNING
    volumes:
      - ../o3p_mcp:/mnt/extra-addons/o3p_mcp:ro
    # Read the bind mounts without relabelling the host files (SELinux hosts).
    security_opt:
      - label:disable
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${E2E_ODOO_INTERNAL_PORT:-18070}/web/health', timeout=3)\""]
      interval: 2s
      timeout: 5s
      retries: 60

  proxy:
    image: nginx:1.27.5-alpine
    network_mode: host
    depends_on:
      odoo:
        condition: service_healthy
    environment:
      E2E_ODOO_PORT: ${E2E_ODOO_PORT:-18069}
      E2E_ODOO_INTERNAL_PORT: ${E2E_ODOO_INTERNAL_PORT:-18070}
      NGINX_ENVSUBST_FILTER: ^E2E_
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    security_opt:
      - label:disable
